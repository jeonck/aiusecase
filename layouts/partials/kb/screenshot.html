{{- $page := .page -}}
{{- $src := .src -}}
{{- $alt := .alt | default "캡처 이미지" -}}
{{- $caption := .caption -}}
{{- $res := "" -}}
{{- if $src -}}
    {{- with $page.Resources.GetMatch (printf "**%s" $src) -}}{{- $res = . -}}{{- end -}}
{{- end -}}
<figure class="kb-shot">
    {{- if $res -}}
        {{- $isSVG := eq $res.MediaType.SubType "svg" -}}
        {{- $disp := $res -}}
        {{- if not $isSVG -}}
            {{- if gt $res.Width 1280 -}}{{- $disp = $res.Resize "1280x q88 webp" -}}{{- end -}}
        {{- end -}}
        <a href="{{ $res.RelPermalink }}" target="_blank" rel="noopener" aria-label="원본 이미지 열기">
            {{- if $isSVG -}}
                <img src="{{ $disp.RelPermalink }}" alt="{{ $alt }}" loading="lazy">
            {{- else -}}
                <img src="{{ $disp.RelPermalink }}" alt="{{ $alt }}" loading="lazy" width="{{ $disp.Width }}" height="{{ $disp.Height }}">
            {{- end -}}
        </a>
    {{- else if and $src (hasPrefix $src "/") -}}
        <a href="{{ $src | relURL }}" target="_blank" rel="noopener" aria-label="원본 이미지 열기">
            <img src="{{ $src | relURL }}" alt="{{ $alt }}" loading="lazy">
        </a>
    {{- else -}}
        <div class="kb-shot-missing">
            캡처 이미지 자리 — 이 페이지 폴더에 <code>{{ $src | default "파일명.png" }}</code> 를 넣으면 여기에 표시됩니다.
        </div>
    {{- end -}}
    {{- with $caption }}<figcaption>{{ . | markdownify }}</figcaption>{{ end -}}
</figure>
