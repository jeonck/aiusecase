  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: AI Usecases 안내봇
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
