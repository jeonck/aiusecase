# CKA 연습용: control-plane 1 + worker 2. 기본 CNI(kindnet)는 NetworkPolicy 를 지원하지 않으므로 끄고 Calico 를 올린다
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16      # Calico 기본값과 맞춘다
nodes:
  - role: control-plane
  - role: worker
  - role: worker
