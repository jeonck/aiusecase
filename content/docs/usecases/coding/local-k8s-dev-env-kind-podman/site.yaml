# 로컬에서 빌드한 이미지를 레지스트리 없이 배포. imagePullPolicy: Never 가 핵심
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiusecases
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: aiusecases }
  template:
    metadata:
      labels: { app: aiusecases }
    spec:
      containers:
        - name: web
          image: localhost/aiusecases:dev
          imagePullPolicy: Never
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: aiusecases
  namespace: demo
spec:
  selector: { app: aiusecases }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiusecases
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
    - host: aiusecases.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: aiusecases, port: { number: 80 } }
