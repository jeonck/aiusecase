hero:
  enable: true
  weight: 10
  template: hero

  badge:
    text: "지식 저장소"
    color: primary
    pill: true
    soft: true

  title: "AI Usecases"
  subtitle: "실제로 써본 **AI 활용 사례**를 캡처 이미지와 **단계별 사용법**으로 남기고, **카테고리로 분류**해 쌓아두는 곳입니다. 다음에 같은 일을 할 때 처음부터 헤매지 않도록."

  ctaButton:
    icon: menu_book
    btnText: "사례 둘러보기"
    url: "/docs/usecases/"
  cta2Button:
    icon: add_circle
    btnText: "사례 추가하기"
    url: "/docs/guide/contribute/"

  info: "캡처 이미지 → 단계별 사용법 → 카테고리 분류. 이 세 가지만 지키면 됩니다."

featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: 이 사이트의 규칙
  subtitle: 사례 하나하나가 같은 형식을 따르기 때문에, 시간이 지나도 검색되고 재사용됩니다.

  items:
    - title: 캡처 이미지가 먼저
      icon: photo_camera
      description: 화면을 캡처해 페이지 폴더에 넣으면 단계마다 이미지가 붙습니다. 글로만 쓴 설명은 6개월 뒤에 재현되지 않습니다.

    - title: 단계별 사용법
      icon: format_list_numbered
      description: step 숏코드로 1, 2, 3 번호가 자동으로 매겨집니다. 각 단계는 "무엇을 눌렀는가"까지 적습니다.

    - title: 카테고리 분류
      icon: category
      description: 업무 영역별 카테고리와 도구/난이도/태그 분류가 동시에 걸립니다. 같은 사례를 여러 경로로 찾을 수 있습니다.

    - title: 프롬프트 원문 보존
      icon: content_copy
      description: prompt 숏코드로 실제 입력한 프롬프트를 그대로 남깁니다. 복사해서 바로 다시 쓸 수 있습니다.

    - title: 전문 검색
      icon: search
      description: FlexSearch 기반 전체 검색이 내장되어 있습니다. 도구 이름이나 업무 키워드로 바로 찾습니다.

    - title: 다크 모드 & 모바일
      icon: dark_mode
      description: 라이트/다크 모드와 모바일 레이아웃을 지원합니다. 이동 중에 폰으로 확인해도 캡처가 읽힙니다.
